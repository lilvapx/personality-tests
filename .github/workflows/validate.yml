name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Datenvalidierung
        run: node scripts/validate-data.mjs

      - name: Übersetzungs-Check
        run: node scripts/check-translations.mjs

      - name: Generierte Daten bauen
        run: node scripts/build-item-index.mjs

      - name: Unit-Tests (Scoring + Datenintegrität)
        run: npx vitest run
